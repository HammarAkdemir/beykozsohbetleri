services:
  - type: web
    name: beykozsohbetleri
    env: python
    buildCommand: npm install && npm run build
    startCommand: python3 server/app.py
    disk:
      name: beykoz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BEYKOZ_DATA
        value: /var/data
      - key: BEYKOZ_ADMIN_NAME
        value: "Harun Akdemir"
      - key: BEYKOZ_ADMIN_USERNAME
        value: "h.akdemir"
      - key: BEYKOZ_ADMIN_PASSWORD
        sync: false
      - key: ZOOM_CLIENT_ID
        value: "jeRflt5gTxOg2UcAhJZ5A"
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_MEETING_NUMBER
        value: "8369840665"
      - key: ZOOM_PASSCODE
        sync: false
